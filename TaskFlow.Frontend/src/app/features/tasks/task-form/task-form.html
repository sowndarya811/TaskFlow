
<div class="form-page">

  <div class="form-header">
    <div>
      <h1>{{ isEditMode() ? 'Edit Task' : 'Create New Task' }}</h1>
      <p>
        {{ isEditMode()
          ? 'Update your task details.'
          : 'Add a new task to your task list.' }}
      </p>
    </div>

    <a routerLink="/tasks" class="back-link">
      ← Back to Tasks
    </a>
  </div>

  <div *ngIf="loading()" class="message loading-message">
    Loading task details...
  </div>

  <div *ngIf="error()" class="message error-message">
    {{ error() }}
  </div>

  <form
    *ngIf="!loading() && (!isEditMode() || taskId !== null)"
    class="task-form"
    #taskForm="ngForm"
    (ngSubmit)="saveTask()"
  >

    <div class="form-group">
      <label for="title">Task Title <span>*</span></label>

      <input
        id="title"
        type="text"
        name="title"
        [(ngModel)]="title"
        required
        maxlength="150"
        placeholder="Enter task title"
        #titleField="ngModel"
      />

      <small
        class="field-error"
        *ngIf="titleField.invalid && titleField.touched"
      >
        Task title is required.
      </small>
    </div>

    <div class="form-group">
      <label for="description">Description</label>

      <textarea
        id="description"
        name="description"
        [(ngModel)]="description"
        rows="4"
        placeholder="Enter task description"
      ></textarea>
    </div>

    <div class="form-row">

      <div class="form-group">
        <label for="dueDate">Due Date <span>*</span></label>

        <input
          id="dueDate"
          type="date"
          name="dueDate"
          [(ngModel)]="dueDate"
          required
        />
      </div>

      <div class="form-group">
        <label for="priority">Priority</label>

        <select
          id="priority"
          name="priority"
          [(ngModel)]="priority"
          required
        >
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
        </select>
      </div>

    </div>

    <div class="form-group" *ngIf="isEditMode()">
      <label for="status">Status</label>

      <select
        id="status"
        name="status"
        [(ngModel)]="status"
        required
      >
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
      </select>
    </div>

    <div class="form-actions">

      <button
        type="button"
        class="cancel-btn"
        (click)="cancel()"
      >
        Cancel
      </button>

      <button
        type="submit"
        class="save-btn"
        [disabled]="taskForm.invalid || saving()"
      >
        {{
          saving()
            ? 'Saving...'
            : (isEditMode() ? 'Update Task' : 'Create Task')
        }}
      </button>

    </div>

  </form>

</div>
